<head>
<meta charset="utf-8">

<title>CalandriaSys · Plano de sembrado</title>

<style>
/* ============================================================
   TOKENS — paleta café Calandria (ThemeManager) llevada a web.
   Estados semánticos deliberadamente separados del acento.
   ============================================================ */
:root {
  --ink:#221E1B; --ink-2:#2F2825; --ink-3:#3C3430;
  --paper:#EDEBE7; --surface:#FFFFFF; --surface-2:#F6F4F1;
  --rule:#D6D1CA; --rule-soft:#E6E2DC;
  --text:#221E1B; --text-2:#5C544D; --text-3:#867D74;
  --brass:#7A5A12; --brass-2:#9A7420; --brass-soft:#F2E8D2;
  --on-ink:#F3F0EC; --on-ink-2:#A2978C;
  --ok:#1F6B4A;   --ok-bg:#E2F0E8;
  --warn:#C2620A; --warn-bg:#FAEADB;
  --stop:#A31D1D; --stop-bg:#F7E3E3;
  --idle:#6B655F; --idle-bg:#E9E6E1;
  --grid:rgba(34,30,27,.07);
  --shadow:0 1px 2px rgba(34,30,27,.06);
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono","SF Mono",Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  --rail:236px; --insp:344px;
  --r:8px; --r-2:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#100E0C; --ink-2:#191512; --ink-3:#241E1A;
    --paper:#14110F; --surface:#1E1A16; --surface-2:#251F1A;
    --rule:#3A322C; --rule-soft:#2C2521;
    --text:#F2EEE9; --text-2:#B3A99E; --text-3:#8A8077;
    --brass:#D9A441; --brass-2:#E8B65C; --brass-soft:#33291A;
    --on-ink:#F2EEE9; --on-ink-2:#948A80;
    --ok:#54B183;   --ok-bg:#163024;
    --warn:#E0913F; --warn-bg:#33240F;
    --stop:#DB6B6B; --stop-bg:#331717;
    --idle:#948C83; --idle-bg:#262119;
    --grid:rgba(242,238,233,.06);
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ink:#100E0C; --ink-2:#191512; --ink-3:#241E1A;
  --paper:#14110F; --surface:#1E1A16; --surface-2:#251F1A;
  --rule:#3A322C; --rule-soft:#2C2521;
  --text:#F2EEE9; --text-2:#B3A99E; --text-3:#8A8077;
  --brass:#D9A441; --brass-2:#E8B65C; --brass-soft:#33291A;
  --on-ink:#F2EEE9; --on-ink-2:#948A80;
  --ok:#54B183;   --ok-bg:#163024;
  --warn:#E0913F; --warn-bg:#33240F;
  --stop:#DB6B6B; --stop-bg:#331717;
  --idle:#948C83; --idle-bg:#262119;
  --grid:rgba(242,238,233,.06);
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --ink:#221E1B; --ink-2:#2F2825; --ink-3:#3C3430;
  --paper:#EDEBE7; --surface:#FFFFFF; --surface-2:#F6F4F1;
  --rule:#D6D1CA; --rule-soft:#E6E2DC;
  --text:#221E1B; --text-2:#5C544D; --text-3:#867D74;
  --brass:#7A5A12; --brass-2:#9A7420; --brass-soft:#F2E8D2;
  --on-ink:#F3F0EC; --on-ink-2:#A2978C;
  --ok:#1F6B4A;   --ok-bg:#E2F0E8;
  --warn:#C2620A; --warn-bg:#FAEADB;
  --stop:#A31D1D; --stop-bg:#F7E3E3;
  --idle:#6B655F; --idle-bg:#E9E6E1;
  --grid:rgba(34,30,27,.07);
  --shadow:0 1px 2px rgba(34,30,27,.06);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--text);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.01em}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:3px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{
  font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-3);
}

/* ================= SHELL DEL PLANO ================= */
/* Ventana propia: una sola columna, altura fija, sin scroll de documento.
   El plano tiene que caber completo para que arrastrar no pelee con la rueda. */
.shell{display:flex; flex-direction:column; height:100dvh; overflow:hidden}

.topbar{
  display:flex; align-items:center; gap:12px; flex:none;
  padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--rule);
}
.topbar .titulo{font-weight:600; font-size:13.5px; letter-spacing:-.01em}
.topbar .tb-spacer{flex:1}
.search{
  display:flex; align-items:center; gap:8px; min-width:200px;
  padding:0 10px; height:34px; border:1px solid var(--rule); border-radius:var(--r);
  background:var(--surface-2); color:var(--text-3);
}
.search svg{width:15px; height:15px; flex:none}
.search input{
  border:0; background:transparent; color:var(--text); font:inherit; font-size:12.5px;
  width:100%; outline:none;
}
.icon-btn{
  width:34px; height:34px; display:grid; place-items:center; flex:none;
  border:1px solid var(--rule); border-radius:var(--r); background:var(--surface-2);
  transition:border-color .16s ease, color .16s ease;
}
.icon-btn:hover{border-color:var(--brass); color:var(--brass)}
.icon-btn svg{width:16px; height:16px}
.seg{display:flex; border:1px solid var(--rule); border-radius:var(--r); overflow:hidden; flex:none}
.seg button{
  padding:0 11px; height:34px; border:0; background:var(--surface-2); color:var(--text-2);
  font-size:11.5px; font-weight:600; transition:background .16s ease, color .16s ease;
}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--brass-soft); color:var(--brass)}
.seg button:hover{color:var(--brass)}

.cuerpo{flex:1; min-height:0; position:relative; background:var(--paper)}

/* --- Plano --- */
.plan-wrap{
  position:relative; flex:1; min-height:0; overflow:hidden;
  background-color:var(--surface-2);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
}
/* touch-action:none — el arrastre mueve el viewBox; sin esto, en pantalla táctil
   el navegador se queda el gesto para hacer scroll y el plano no se mueve. */
.plan-svg{
  display:block; width:100%; height:100%; min-height:0;
  cursor:grab; touch-action:none;
}
.plan-svg.is-arrastrando{cursor:grabbing}
.plan-svg.is-arrastrando .lot{cursor:grabbing}
/* El plano es una lámina CAD sobre blanco. En tema oscuro se invierte para que
   no quede un tablón luminoso en medio; hue-rotate devuelve los colores de los
   lotes a su tono original después de la inversión. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme]) #plano{filter:invert(1) hue-rotate(180deg)}
}
:root[data-theme="dark"] #plano{filter:invert(1) hue-rotate(180deg)}
:root[data-theme="light"] #plano{filter:none}
/* fill-box para que scale/rotate giren sobre el pin y no sobre el origen del SVG */
.lot{cursor:pointer; transform-box:fill-box; transform-origin:center}
.lot .body{transition:stroke-width .12s ease}
/* Área de toque invisible: el pin visible mide ~9 px en pantalla, muy por debajo
   del mínimo de 44 px, así que cada lote lleva un blanco de golpeo más grande. */
.lot .hit{fill:transparent; stroke:none}
.lot:hover .body{stroke:var(--brass); stroke-width:34}
.lot:focus-visible{outline:none}
.lot:focus-visible .body{stroke:var(--brass); stroke-width:40}
.lot.is-sel .body{stroke:var(--brass); stroke-width:44}
.lot .tip{
  font-family:var(--mono); font-size:82px; fill:var(--text);
  pointer-events:none; text-anchor:middle; font-weight:700;
  opacity:0; transition:opacity .14s ease;
}
.lot:hover .tip,.lot.is-sel .tip,.lot:focus-visible .tip{opacity:1}
.lot .halo{fill:var(--surface); stroke:none; opacity:0; transition:opacity .14s ease}
.lot:hover .halo,.lot.is-sel .halo,.lot:focus-visible .halo{opacity:.9}
.mz-label{
  font-family:var(--mono); font-size:118px; font-weight:700; fill:var(--text-3);
  letter-spacing:.06em; pointer-events:none;
}
.mz-hull{fill:var(--grid); stroke:var(--rule); stroke-width:6; stroke-dasharray:26 20}
.legend{
  display:flex; gap:14px; flex-wrap:wrap; padding:9px 16px;
  border-top:1px solid var(--rule-soft); background:var(--surface); flex:none;
}
.lg{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-2)}
/* Las muestras replican el achurado del plano con gradientes: un <span> de HTML
   no puede referenciar un <pattern> de SVG. */
.lg-sw{width:13px; height:13px; border-radius:2px; border:1px solid; flex:none}
.sw-ok{background:var(--ok-bg); border-color:var(--ok)}
.sw-warn{
  border-color:var(--warn);
  background:repeating-linear-gradient(45deg,
    var(--warn-bg) 0 2px, color-mix(in srgb,var(--warn) 55%,transparent) 2px 3.4px);
}
.sw-stop{
  border-color:var(--stop);
  background:
    repeating-linear-gradient(45deg, transparent 0 2px, color-mix(in srgb,var(--stop) 55%,transparent) 2px 3px),
    repeating-linear-gradient(-45deg, var(--stop-bg) 0 2px, color-mix(in srgb,var(--stop) 55%,transparent) 2px 3px);
}
.sw-idle{background:var(--idle-bg); border-color:var(--rule); border-style:dashed}
.seg{display:flex; border:1px solid var(--rule); border-radius:var(--r-2); overflow:hidden}
.seg button{
  background:var(--surface); border:0; padding:5px 10px; font-size:11.5px;
  color:var(--text-2); border-right:1px solid var(--rule); min-height:30px;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brass-soft); color:var(--brass); font-weight:600}

/* El plano ocupa toda la ventana en esta página. */
.plan-wrap{position:absolute; inset:0; border:0; border-radius:0; background:var(--surface-2)}
.legend{
  position:absolute; left:16px; bottom:16px; z-index:3;
  display:flex; gap:14px; flex-wrap:wrap; padding:8px 12px;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  border:1px solid var(--rule-soft); border-radius:var(--r-2);
  backdrop-filter:blur(8px);
}

/* ---- Tarjeta flotante de la casa elegida ---- */
.pick{
  position:absolute; right:16px; top:16px; z-index:4; width:264px;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-2);
  box-shadow:0 8px 28px rgba(0,0,0,.14); padding:14px; display:none;
}
.pick.is-on{display:block}
.pick-id{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
.pick-code{font-family:var(--mono); font-size:19px; font-weight:600; letter-spacing:-.02em}
.pick-meter{height:6px; border-radius:99px; background:var(--rule-soft); overflow:hidden; margin:10px 0 4px}
.pick-meter > i{display:block; height:100%; border-radius:99px; background:var(--brass)}
.pick-row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-2); padding:4px 0}
.pick-row b{font-family:var(--mono); color:var(--text); font-weight:600}
.pick-nota{
  margin-top:10px; padding-top:10px; border-top:1px solid var(--rule-soft);
  font-size:11px; color:var(--text-3); line-height:1.45;
}
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
  font-size:10.5px; font-weight:700; white-space:nowrap;
}
.badge svg{width:11px; height:11px; stroke-width:2.4}
.b-ok{background:var(--ok-bg); color:var(--ok)}
.b-warn{background:var(--warn-bg); color:var(--warn)}
.b-stop{background:var(--stop-bg); color:var(--stop)}
.b-idle{background:var(--idle-bg); color:var(--idle)}

/* ================= AVISO ================= */
/* Confirma que el clic salió hacia el host. La ventana WinForms tarda en
   aparecer y sin esto el botón parece muerto. */
.toast{
  position:fixed; left:50%; bottom:22px; transform:translate(-50%,14px);
  background:var(--ink); color:var(--on-ink); border:1px solid var(--ink-3);
  border-radius:var(--r-2); padding:9px 14px; font-size:12.5px;
  box-shadow:0 6px 22px rgba(0,0,0,.28); z-index:50;
  opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
}
.toast.is-on{opacity:1; transform:translate(-50%,0)}
.toast.is-warn{background:var(--stop); border-color:var(--stop); color:#fff}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important}
}
</style>

<div class="shell">

  const FILL = { ok:"var(--ok-bg)", warn:"url(#hWarn)", stop:"url(#hStop)", idle:"var(--idle-bg)" };
  const LINE = { ok:"var(--ok)", warn:"var(--warn)", stop:"var(--stop)", idle:"var(--rule)" };
  const NOMBRE = { ok:"Terminado", warn:"En proceso", stop:"Detenido", idle:"Sin iniciar" };

  const NS = "http://www.w3.org/2000/svg";

  const plan = document.getElementById("plan");

  const el = (n, a = {}) => {

    return e;
  };
  const esc = s => (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const mx = n => "$" + Math.round(+n || 0).toLocaleString("es-MX");
  const nodo = c => plan.querySelector('.lot[data-k="' + casas.indexOf(c) + '"]');

  const R_PIN = 58, R_HIT = 130;

  function dibujar() {
    gLots.textContent = "";

    const grupos = {};
    casas.forEach(c => (grupos[c.mzNum] = grupos[c.mzNum] || []).push(c));
    Object.entries(grupos).forEach(([mz, lista]) => {
      const cx = lista.reduce((s, c) => s + c.x, 0) / lista.length;
      const cy = Math.min(...lista.map(c => c.y)) - 150;
      const t = el("text", { x: cx, y: cy, class: "mz-label", "text-anchor": "middle" });
      t.textContent = "MZ " + mz;
      gLots.appendChild(t);
    });

    casas.forEach(c => {
      const g = el("g", { class: "lot", tabindex: "0", role: "button", "data-k": casas.indexOf(c) });
      g.setAttribute("aria-label",
        "Manzana " + c.mzNum + " lote " + c.lote + ", " + NOMBRE[c.estado] + ", " + c.avance + " por ciento de avance");

      const fill = modo === "avance" ? FILL[c.estado]
        : (c.proto === "Calandra" ? "var(--brass-soft)" : "var(--surface-2)");
      const stroke = modo === "avance" ? LINE[c.estado]
        : (c.proto === "Calandra" ? "var(--brass)" : "var(--rule)");

      g.appendChild(el("circle", { class: "hit", cx: c.x, cy: c.y, r: R_HIT }));
      const pin = el("circle", { class: "body", cx: c.x, cy: c.y, r: R_PIN, fill, stroke, "stroke-width": 16 });
      if (modo === "avance" && c.estado === "idle") pin.setAttribute("stroke-dasharray", "34 26");
      g.appendChild(pin);

      g.appendChild(el("circle", { class: "halo", cx: c.x, cy: c.y - 168, r: 96 }));
      const t = el("text", { class: "tip", x: c.x, y: c.y - 140 });
      t.textContent = c.lote;
      g.appendChild(t);

      g.addEventListener("click", () => elegir(c, g));
      g.addEventListener("keydown", ev => {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); elegir(c, g); }
      });
      gLots.appendChild(g);
    });
  }

  // ---- Zoom sobre el viewBox (mismo espacio que las coordenadas) ----
  const VB0 = [1730, 520, 4170, 3650];
  let vb = [...VB0];
  const aplicarVb = () => plan.setAttribute("viewBox", vb.join(" "));

  let vbAnim = null;
  function irA(nv) {
    if (REDUCE) { vb = nv; aplicarVb(); return; }
    if (vbAnim) vbAnim.pause();
    const o = { a: vb[0], b: vb[1], c: vb[2], d: vb[3] };
    vbAnim = animate(o, {
      a: nv[0], b: nv[1], c: nv[2], d: nv[3],
      duration: 560, ease: "outExpo",
      onUpdate: () => { vb = [o.a, o.b, o.c, o.d]; aplicarVb(); }
    });
  }
  function zoom(f) {
    const cx = vb[0] + vb[2] / 2, cy = vb[1] + vb[3] / 2;
    const w = Math.min(VB0[2] * 1.2, Math.max(600, vb[2] * f));
    const h = Math.min(VB0[3] * 1.2, Math.max(525, vb[3] * f));
    irA([cx - w / 2, cy - h / 2, w, h]);
  }
  document.getElementById("zIn").addEventListener("click", () => zoom(1 / 1.35));
  document.getElementById("zOut").addEventListener("click", () => zoom(1.35));
  document.getElementById("zFit").addEventListener("click", () => irA([...VB0]));

  }
  function puntoEnPlano(ev) {
    const m = metrica();
    return [vb[0] + (ev.clientX - m.r.left - m.offX) * m.uPorPx,
            vb[1] + (ev.clientY - m.r.top - m.offY) * m.uPorPx];
  }

    if (!arr) return;
    const dx = ev.clientX - arr.x, dy = ev.clientY - arr.y;
    if (!arr.movido && Math.abs(dx) + Math.abs(dy) < 4) return;

  // ---- Selección ----
  function elegir(c, g, avisar) {
    plan.querySelectorAll(".lot.is-sel").forEach(n => n.classList.remove("is-sel"));
    if (g) {
      g.classList.add("is-sel");
      g.parentNode.appendChild(g);
      if (!REDUCE) animate(g, { scale: [1, 1.5, 1], duration: 420, ease: "outQuad" });
    }
    sel = c;
    tarjeta(c);
    if (avisar !== false && HOST) HOST.postMessage({ accion: "seleccion", manzana: c.mzNum, lote: String(c.lote) });
  }

  function tarjeta(c) {
    const pct = Math.max(0, Math.min(100, c.avance || 0));
    pick.innerHTML =
      '<div class="pick-id">' +
        '<div><div class="eyebrow">Manzana ' + esc(c.mzNum) + ' · Lote ' + esc(c.lote) + '</div>' +
        '<div class="pick-code">' + esc(c.mz) + '·L' + String(c.lote).padStart(2, "0") + '</div></div>' +
        '<span class="badge ' + CHIP[c.estado] + '">' + NOMBRE[c.estado] + '</span>' +
      '</div>' +
      '<div class="pick-meter"><i style="width:' + pct + '%"></i></div>' +
      '<div class="pick-row"><span>Avance</span><b>' + pct + '%</b></div>' +
      '<div class="pick-row"><span>Destajos terminados</span><b>' + (c.comp || 0) + ' / ' + (c.total || 0) + '</b></div>' +
      '<div class="pick-row"><span>Ejecutado</span><b>' + mx(c.ejec) + '</b></div>' +
      (c.proto ? '<div class="pick-row"><span>Prototipo</span><b>' + esc(c.proto) + '</b></div>' : '') +
      '<div class="pick-nota">Ya quedó cargada en el panel principal. Desde allá se abren estimación, destajos y evidencias.</div>';
    pick.classList.add("is-on");
    if (!REDUCE) {
      animate(pick, { opacity: [0, 1], x: [10, 0], duration: 240, ease: "outQuad" });
      animate(pick.querySelector(".pick-meter > i"), { width: ["0%", pct + "%"], duration: 620, ease: "outExpo" });
    }
  }

  // ---- Buscador ----
  document.getElementById("q").addEventListener("input", e => {
    const m = e.target.value.toUpperCase().match(/M?\s*(\d+)\s*L?\s*(\d+)/);
    if (!m) return;
    const c = casas.find(k => k.mzNum === m[1] && k.lote === +m[2]);
    if (!c) { aviso("No se encontró la casa M" + m[1] + " L" + m[2] + ".", true); return; }
    elegir(c, nodo(c));
    irA([c.x - 900, c.y - 790, 1800, 1580]);
  });

  document.querySelectorAll(".seg [data-mode]").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".seg [data-mode]").forEach(o => o.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      modo = b.dataset.mode;
      dibujar();
      if (sel) { const n = nodo(sel); if (n) n.classList.add("is-sel"); }
    });
  });

  document.getElementById("theme").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  });

  // ---- Aviso ----
  const toastEl = document.getElementById("toast");
  let toastT = null;
  function aviso(txt, warn) {
    toastEl.textContent = txt;
    toastEl.classList.toggle("is-warn", !!warn);
    toastEl.classList.add("is-on");
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove("is-on"), warn ? 3200 : 1800);
  }

  function encuadrarTodo() {
    if (!casas.length) return;
    const xs = casas.map(c => c.x), ys = casas.map(c => c.y), m = 260;
    const x0 = Math.min(...xs) - m, y0 = Math.min(...ys) - m;
    VB0.length = 0;
    VB0.push(x0, y0, Math.max(...xs) - Math.min(...xs) + m * 2, Math.max(...ys) - Math.min(...ys) + m * 2);
    irA([...VB0]);
  }

  // ---- Puente con el host ----
  if (HOST) {
    HOST.addEventListener("message", ev => {
      const d = ev.data;
      if (!d || !d.tipo) return;
      if (d.tipo === "tema") {
        const root = document.documentElement.style;
        if (d.colorPrimario) root.setProperty("--brass", d.colorPrimario);
        if (d.colorSecundario) root.setProperty("--brass-2", d.colorSecundario);
        if (d.colorSuave) root.setProperty("--brass-soft", d.colorSuave);
        return;
      }
      if (d.tipo !== "datos") return;
      if (Array.isArray(d.casas) && d.casas.length) {
        casas = d.casas.map(c => ({
          mz: "M" + c.mz, mzNum: c.mz, lote: c.lote, x: c.x, y: c.y,
          estado: c.estado || "idle", avance: c.avance || 0, total: c.total || 0,
          comp: c.comp || 0, activados: c.activados || 0, proto: c.proto || "",
          presup: c.presup || 0, ejec: c.ejec || 0, dias: c.dias || 0
        }));
        sel = null;
        pick.classList.remove("is-on");
        dibujar();
        encuadrarTodo();
        entrada();
      }
      // El panel ya tenía una casa cargada: se refleja aquí sin rebotar el mensaje.
      if (d.manzana && d.lote) {
        const c = casas.find(k => k.mzNum === String(d.manzana) && k.lote === +d.lote);
        if (c) { elegir(c, nodo(c), false); irA([c.x - 900, c.y - 790, 1800, 1580]); }
      }
    });
    HOST.postMessage({ accion: "plano-listo" });
  }

  // Entrada: los lotes aparecen del centro hacia afuera. Es la única animación
  // de carga; comunica la extensión del fraccionamiento de un vistazo.
  function entrada() {
    if (REDUCE) return;
    animate(".mz-label", { opacity: [0, 1], duration: 400, delay: stagger(70) });
    animate(".lot", {
      opacity: [0, 1], scale: [0.15, 1], duration: 620, ease: "outBack",
      delay: stagger(6, { from: "center" })
    });
  }

  dibujar();
  entrada();
})();
</script>

</body>
</html>
