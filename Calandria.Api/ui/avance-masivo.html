<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CalandriaSys · Avance Masivo</title>

<style>
/* Tokens copiados de clientes.html/login.html (paleta café Calandria). */
:root {
  --ink:#221E1B; --paper:#EDEBE7; --surface:#FFFFFF; --surface-2:#F6F4F1;
  --rule:#D6D1CA; --rule-soft:#E6E2DC;
  --text:#221E1B; --text-2:#5C544D; --text-3:#867D74;
  --brass:#7A5A12; --brass-2:#9A7420; --brass-soft:#F2E8D2;
  --on-ink:#F3F0EC;
  --ok:#1F6B4A; --ok-bg:#E2F0E8;
  --warn:#C2620A; --warn-bg:#FAEADB;
  --stop:#A31D1D; --stop-bg:#F7E3E3;
  --shadow-lg:0 18px 46px -18px rgba(34,30,27,.35), 0 2px 6px rgba(34,30,27,.06);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  --r:8px; --r-2:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#F2EEE9; --paper:#14110F; --surface:#1E1A16; --surface-2:#251F1A;
    --rule:#3A322C; --rule-soft:#2C2521;
    --text:#F2EEE9; --text-2:#B3A99E; --text-3:#8A8077;
    --brass:#D9A441; --brass-2:#E8B65C; --brass-soft:#33291A;
    --on-ink:#17130C;
    --ok:#54B183; --ok-bg:#163024;
    --warn:#E0913F; --warn-bg:#33240F;
    --stop:#DB6B6B; --stop-bg:#331717;
    --shadow-lg:0 18px 46px -18px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ink:#F2EEE9; --paper:#14110F; --surface:#1E1A16; --surface-2:#251F1A;
  --rule:#3A322C; --rule-soft:#2C2521;
  --text:#F2EEE9; --text-2:#B3A99E; --text-3:#8A8077;
  --brass:#D9A441; --brass-2:#E8B65C; --brass-soft:#33291A;
  --on-ink:#17130C; --ok:#54B183; --ok-bg:#163024;
  --warn:#E0913F; --warn-bg:#33240F; --stop:#DB6B6B; --stop-bg:#331717;
}
:root[data-theme="light"]{
  --ink:#221E1B; --paper:#EDEBE7; --surface:#FFFFFF; --surface-2:#F6F4F1;
  --rule:#D6D1CA; --rule-soft:#E6E2DC;
  --text:#221E1B; --text-2:#5C544D; --text-3:#867D74;
  --brass:#7A5A12; --brass-2:#9A7420; --brass-soft:#F2E8D2;
  --on-ink:#F3F0EC; --ok:#1F6B4A; --ok-bg:#E2F0E8;
  --warn:#C2620A; --warn-bg:#FAEADB; --stop:#A31D1D; --stop-bg:#F7E3E3;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--text);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1{font-size:20px; margin:0 0 4px}
h2{font-size:15px; margin:0 0 14px; color:var(--brass-2)}
p{color:var(--text-2); margin:0}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px}

.wrap{max-width:920px; margin:0 auto; padding:32px 20px 48px}
.head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:24px; gap:12px; flex-wrap:wrap}
.head .sub{font-size:12.5px; color:var(--text-3)}
.volver{background:none; border:1px solid var(--rule); border-radius:var(--r); padding:8px 14px; font-size:12.5px; color:var(--text-2); cursor:pointer}
.volver:hover{background:var(--surface-2)}

.aviso{
  display:flex; gap:10px; background:var(--warn-bg); color:var(--warn); border-radius:var(--r);
  padding:10px 14px; font-size:12.5px; line-height:1.5; margin-bottom:20px;
}

.card{
  background:var(--surface); border:1px solid var(--rule-soft); border-radius:var(--r-2);
  box-shadow:var(--shadow-lg); padding:28px 30px; margin-bottom:24px;
}

.grid{display:grid; grid-template-columns:2fr 1fr; gap:16px}
@media (max-width:640px){ .grid{grid-template-columns:1fr} }
.field{margin-bottom:0}
.field label{display:block; font-size:12px; font-weight:600; color:var(--text-2); margin-bottom:6px; letter-spacing:.02em}
select, input[type=number]{
  width:100%; height:42px; padding:0 12px; border:1.5px solid var(--rule); border-radius:var(--r);
  background:var(--surface); color:var(--text); font-size:14px; font-family:inherit;
  transition:border-color .15s ease, box-shadow .15s ease;
}
select:focus, input:focus{outline:none; border-color:var(--brass); box-shadow:0 0 0 3px var(--brass-soft)}

button{font:inherit; cursor:pointer; border:none; border-radius:var(--r); padding:10px 22px; font-weight:600}
.btn-primary{background:var(--brass); color:var(--on-ink)}
.btn-primary:disabled{background:var(--rule); color:var(--text-3); cursor:not-allowed}
.btn-secundario{background:var(--surface-2); color:var(--text); border:1.5px solid var(--rule) !important}

.toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap}
.contador{font-size:12.5px; color:var(--text-3)}

.casas{max-height:360px; overflow-y:auto; border:1px solid var(--rule-soft); border-radius:var(--r)}
.manzana-grupo{border-bottom:1px solid var(--rule-soft)}
.manzana-grupo:last-child{border-bottom:none}
.manzana-cab{
  display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--surface-2);
  font-size:12px; font-weight:700; color:var(--text-2); letter-spacing:.02em; cursor:pointer;
}
.casa-fila{display:flex; align-items:center; gap:10px; padding:7px 12px 7px 30px; font-size:13px}
.casa-fila:hover{background:var(--surface-2)}
.casa-fila .lote{font-weight:600}
.casa-fila .proto{color:var(--text-3); font-size:12px}
input[type=checkbox]{width:16px; height:16px; accent-color:var(--brass)}

.vacio{color:var(--text-3); font-size:13px; padding:16px}

.resultado{margin-top:16px; font-size:12.5px; padding:12px 14px; border-radius:var(--r); display:none}
.resultado.is-ok{display:block; background:var(--ok-bg); color:var(--ok)}
.resultado.is-warn{display:block; background:var(--warn-bg); color:var(--warn)}

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%); opacity:0;
  background:var(--ink); color:var(--on-ink); padding:10px 16px; border-radius:var(--r); font-size:12.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.3); pointer-events:none; z-index:200; max-width:min(480px,80vw);
  transition:opacity .2s ease;
}
.toast.is-error{background:var(--stop)}
.toast.is-ok{background:var(--ok)}
</style>
</head>
<body>

<div class="wrap">
  <div class="head">
    <div>
      <h1>Avance Masivo</h1>
      <p class="sub">Marca el % de avance de una partida en varias casas al mismo tiempo.</p>
    </div>
    <button class="volver" id="btnVolver">Volver</button>
  </div>

  <div class="aviso">
    Esto sólo actualiza el avance de obra (partidas de Estimación). No activa, finaliza ni modifica destajos, cuadrillas ni compras.
  </div>

  <div class="card">
    <h2>Partida y avance</h2>
    <div class="grid">
      <div class="field">
        <label for="fPartida">Partida</label>
        <select id="fPartida"><option value="">Cargando…</option></select>
      </div>
      <div class="field">
        <label for="fAvance">Avance %</label>
        <input type="number" id="fAvance" min="0" max="100" step="0.5" value="100">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Casas</h2>
    <div class="toolbar">
      <span class="contador" id="contadorSel">0 casas seleccionadas</span>
      <button class="btn-secundario" id="btnTodas">Seleccionar / deseleccionar todas</button>
    </div>
    <div class="casas" id="listaCasas"><p class="vacio">Cargando…</p></div>

    <button class="btn-primary" id="btnAplicar" style="margin-top:18px" disabled>Aplicar avance</button>
    <div class="resultado" id="resultado"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const HOST = window.chrome && window.chrome.webview ? window.chrome.webview : null;
const el = id => document.getElementById(id);

let partidas = [];
let casas = [];        // { manzana, lote, prototipo, sel }
let manzanasColapsadas = new Set();

let _toastTimer = null;
function toast(msg, tipo){
  const t = el('toast');
  t.textContent = msg;
  t.className = 'toast' + (tipo ? ' is-' + tipo : '');
  clearTimeout(_toastTimer);
  t.style.opacity = 1;
  _toastTimer = setTimeout(()=>{ t.style.opacity = 0; }, 3200);
}

function alHost(accion, extra){
  if (!HOST){ toast('Sin aplicación anfitriona: esta acción sólo funciona dentro de CalandriaSys.', 'error'); return; }
  HOST.postMessage(Object.assign({ accion }, extra || {}));
}

function renderPartidas(){
  const sel = el('fPartida');
  if (!partidas.length){ sel.innerHTML = '<option value="">Sin partidas disponibles</option>'; return; }
  sel.innerHTML = partidas.map((p, i) => `<option value="${i}">${p.etiqueta}</option>`).join('');
}

function actualizarContador(){
  const n = casas.filter(c => c.sel).length;
  el('contadorSel').textContent = `${n} casa(s) seleccionada(s)`;
  el('btnAplicar').disabled = n === 0;
}

function renderCasas(){
  const cont = el('listaCasas');
  if (!casas.length){ cont.innerHTML = '<p class="vacio">No hay casas en el inventario.</p>'; actualizarContador(); return; }

  const porManzana = {};
  casas.forEach((c, i) => { (porManzana[c.manzana] = porManzana[c.manzana] || []).push(i); });

  cont.innerHTML = Object.keys(porManzana).sort().map(m => {
    const idxs = porManzana[m];
    const todasSel = idxs.every(i => casas[i].sel);
    const colapsada = manzanasColapsadas.has(m);
    const filas = idxs.map(i => {
      const c = casas[i];
      return `
        <div class="casa-fila">
          <input type="checkbox" data-idx="${i}" class="chk-casa" ${c.sel ? 'checked' : ''}>
          <span class="lote">Lote ${c.lote}</span>
          <span class="proto">${c.prototipo || ''}</span>
        </div>`;
    }).join('');
    return `
      <div class="manzana-grupo">
        <div class="manzana-cab" data-m="${m}">
          <input type="checkbox" class="chk-manzana" data-m="${m}" ${todasSel ? 'checked' : ''}>
          <span>Manzana ${m} (${idxs.length})</span>
        </div>
        <div class="manzana-filas" data-m="${m}" style="${colapsada ? 'display:none' : ''}">${filas}</div>
      </div>`;
  }).join('');

  cont.querySelectorAll('.chk-casa').forEach(chk => {
    chk.addEventListener('change', () => {
      casas[Number(chk.dataset.idx)].sel = chk.checked;
      actualizarContador();
      // Sólo refleja el estado del check de manzana, sin redibujar todo (evita perder el scroll).
      const grupo = chk.closest('.manzana-grupo');
      const m = grupo.querySelector('.chk-manzana').dataset.m;
      const idxs = casas.map((c, i) => c.manzana === m ? i : -1).filter(i => i >= 0);
      grupo.querySelector('.chk-manzana').checked = idxs.every(i => casas[i].sel);
    });
  });

  cont.querySelectorAll('.manzana-cab').forEach(cab => {
    cab.addEventListener('click', (ev) => {
      if (ev.target.classList.contains('chk-manzana')) return;
      const m = cab.dataset.m;
      if (manzanasColapsadas.has(m)) manzanasColapsadas.delete(m); else manzanasColapsadas.add(m);
      renderCasas();
    });
  });

  cont.querySelectorAll('.chk-manzana').forEach(chk => {
    chk.addEventListener('click', (ev) => ev.stopPropagation());
    chk.addEventListener('change', () => {
      const m = chk.dataset.m;
      casas.forEach(c => { if (c.manzana === m) c.sel = chk.checked; });
      renderCasas();
    });
  });

  actualizarContador();
}

el('btnTodas').addEventListener('click', () => {
  const algunaSinSel = casas.some(c => !c.sel);
  casas.forEach(c => c.sel = algunaSinSel);
  renderCasas();
});

el('btnVolver').addEventListener('click', () => alHost('volver'));

el('btnAplicar').addEventListener('click', () => {
  const idx = el('fPartida').value;
  if (idx === '' || !partidas[idx]){ toast('Selecciona una partida.', 'error'); return; }
  const avance = parseFloat(el('fAvance').value);
  if (isNaN(avance) || avance < 0 || avance > 100){ toast('El avance debe ser un número entre 0 y 100.', 'error'); return; }

  const seleccionadas = casas.filter(c => c.sel);
  if (!seleccionadas.length){ toast('Selecciona al menos una casa.', 'error'); return; }

  const p = partidas[idx];
  const ok = confirm(`Se marcará "${p.etiqueta}" al ${avance}% en ${seleccionadas.length} casa(s).\n\nEsto sólo actualiza el avance de obra; no afecta destajos ni compras.\n\n¿Continuar?`);
  if (!ok) return;

  el('btnAplicar').disabled = true;
  el('resultado').className = 'resultado';
  alHost('aplicar-avance', {
    wbs: p.wbs,
    padre: p.padre,
    costoTunera: p.costoTunera,
    costoCalandra: p.costoCalandra,
    avance,
    casas: seleccionadas.map(c => ({ manzana: c.manzana, lote: c.lote, prototipo: c.prototipo }))
  });
});

if (HOST){
  HOST.addEventListener('message', (ev) => {
    const d = ev.data;
    if (!d || !d.tipo) return;
    switch (d.tipo){
      case 'datos':
        partidas = d.partidas || [];
        casas = (d.casas || []).map(c => Object.assign({ sel: false }, c));
        renderPartidas();
        renderCasas();
        break;
      case 'resultado':
        el('btnAplicar').disabled = false;
        actualizarContador();
        const box = el('resultado');
        box.className = 'resultado ' + (d.errores && d.errores.length ? 'is-warn' : 'is-ok');
        box.textContent = (d.errores && d.errores.length)
          ? `${d.ok} casa(s) actualizadas. ${d.errores.length} con error: ${d.errores.slice(0,5).join(' | ')}`
          : `Listo: ${d.ok} casa(s) actualizadas.`;
        toast(d.errores && d.errores.length ? 'Se aplicó con algunos errores.' : 'Avance aplicado.', d.errores && d.errores.length ? 'error' : 'ok');
        break;
      case 'error':
        el('btnAplicar').disabled = false;
        toast(d.mensaje || 'Ocurrió un error.', 'error');
        break;
    }
  });
  alHost('cargar-datos');
} else {
  el('listaCasas').innerHTML = '<p class="vacio">Abre esta pantalla desde CalandriaSys.</p>';
}
</script>

</body>
</html>
